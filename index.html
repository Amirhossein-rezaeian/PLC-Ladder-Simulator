 یعنی چه؟",options:["Normally Open بازِ عادی","Normally Off","New Output","Neutral Only"],answer:0}]},{id:"l2",chapter:"فصل ۱ · نمادها",title:"کنتاکت بسته NC",body:"کنتاکت NC در حالت عادی جریان را عبور می‌دهد و با یک شدن بیت قطع می‌شود. شستی استپ و استپ اضطراری NC هستند.",points:10,exampleId:"estop",quiz:[{q:"اگر I0.1 صفر باشد، کنتاکت NC آن چه می‌کند؟",options:["قطع است","رسانا است","کویل را ست می‌کند","تایمر را صفر می‌کند"],answer:1},{q:"شستی استپ بهتر است کدام باشد؟",options:["NO","NC","SET","CTU"],answer:1}]},{id:"l3",chapter:"فصل ۱ · نمادها",title:"کویل خروجی دایره‌ای",body:"کویل در IEC و آذر دایره است ( ) نه دو خط. انرژی سمت چپ رانگ، بیت Q را یک می‌کند و در کارخانه موتور/پمپ/لامپ همان خروجی را نشان می‌دهد.",points:10,exampleId:"startstop",quiz:[{q:"شکل درست کویل چیست؟",options:["دو خط مثل NO","دایره ( )","مثلث","فقط متن Q"],answer:1},{q:"کویل Q0.0 در کارخانه موتور به چه وصل است؟",options:["ورودی سنسور","خروجی کنتاکتور موتور","فقط HMI","تایمر"],answer:1}]},{id:"l4",chapter:"فصل ۲ · مدار فرمان",title:"نگهدارنده (Latch)",body:"دو رانگ روی یک کویل مثل مدار موازی است: رانگ استارت و رانگ کنتاکت خودنگهدار. استپ NC هر دو را قطع می‌کند. مثال استارت/استپ را RUN کنید و نتیجه را در کارخانه ببینید.",points:15,exampleId:"startstop",quiz:[{q:"چرا بعد از رها کردن استارت موتور می‌ماند؟",options:["تایمر","کنتاکت خودنگهدار Q","قطع استپ","HMI"],answer:1},{q:"دو رانگ به یک کویل یعنی چه؟",options:["AND","OR موازی","NOT","مقایسه"],answer:1}]},{id:"l5",chapter:"فصل ۳ · تایمر",title:"تایمر TON",body:"TON تا وقتی ورودی یک است Accumulator را بالا می‌برد. وقتی ACC ≥ PT بیت T یک می‌شود. قطع ورودی ACC را صفر می‌کند. جدول تایمرها را در شبیه‌ساز ببینید.",points:15,exampleId:"timer",quiz:[{q:"در TON اگر ورودی قطع شود ACC چه می‌شود؟",options:["همان می‌ماند","صفر می‌شود","تا PT می‌رود","منفی می‌شود"],answer:1},{q:"واحد PT در این شبیه‌ساز چیست؟",options:["دقیقه","میلی‌ثانیه","ساعت","پالس"],answer:1},{q:"PT=5000 یعنی؟",options:["۵ ساعت","۵ ثانیه","۵ اسکن","۵ روز"],answer:1},{q:"خروجی TON کی یک می‌شود؟",options:["همان لحظه ورودی","وقتی ACC به PT برسد","فقط STOP","هیچ‌وقت"],answer:1}]},{id:"l6",chapter:"فصل ۳ · تایمر",title:"تایمر TOF",body:"TOF با یک شدن ورودی فوراً Q می‌شود. بعد از صفر شدن ورودی، تا PT ثانیه Q یک می‌ماند. برای آلارم قطع تغذیه مناسب است.",points:15,exampleId:"alarm",quiz:[{q:"TOF چه زمانی شروع به شمارش قطع می‌کند؟",options:["لبه بالارونده","لبه پایین‌رونده ورودی","همیشه","فقط در STOP"],answer:1},{q:"کاربرد نمونه TOF؟",options:["شمارش قطعه","آلارم باقی‌مانده بعد قطع","چراغ سبز","SET"],answer:1}]},{id:"l7",chapter:"فصل ۴ · شمارنده",title:"شمارنده CTU",body:"هر لبه بالارونده ورودی یک عدد به ACC اضافه می‌کند. وقتی ACC ≥ PV بیت C یک است. ریست با کویل RST روی همان آدرس C.",points:15,exampleId:"counter",quiz:[{q:"CTU روی چه لبه‌ای می‌شمارد؟",options:["پایین","بالارونده","هر اسکن","فقط RUN"],answer:1},{q:"اگر PV=5 باشد از چه عددی Q یک می‌شود؟",options:["۴","۵","۰","۱"],answer:1}]},{id:"l8",chapter:"فصل ۵ · کارخانه",title:"نوار و مخزن",body:"خروجی لدر همان عملگر کارخانه است: Q0.0 موتور نوار یا پمپ. سنسورها ورودی می‌نویسند (I0.2 قطعه، I0.1 سطح بالا). برنامه را RUN کنید و در تب کارخانه نتیجه را ببینید.",points:20,exampleId:"tank",quiz:[{q:"سطح بالای مخزن معمولاً چه می‌کند؟",options:["پمپ را روشن","پمپ را با NC قطع","شمارنده","HMI را خاموش"],answer:1},{q:"سنسور قطعه نوار کدام آدرس است؟",options:["Q0.0","I0.2","T1","C2"],answer:1}]},{id:"l9",chapter:"فصل ۰ · برق صنعتی",title:"PLC چیست؟",img:"https://images.pexels.com/photos/32529354/pexels-photo-32529354.jpeg?auto=compress&cs=tinysrgb&w=800",table:{h:["بخش","کار"],r:[["CPU","اجرای لدر و اسکن"],["کارت I","خواندن شستی و سنسور"],["کارت Q","فرمان کنتاکتور و لامپ"],["منبع ۲۴V","تغذیه مدار فرمان"]]},body:"PLC یا کنترل‌کننده منطقی برنامه‌پذیر مغز تابلو فرمان است. به‌جای رله‌های زیاد، منطق با برنامه لدر داخل CPU اجرا می‌شود. ورودی‌ها (شستی، سنسور، لیمیت) به کارت I می‌روند و خروجی‌ها (کنتاکتور، شیر، لامپ) از کارت Q فرمان می‌گیرند. اسکن PLC پیوسته است: خواندن ورودی، اجرای برنامه، نوشتن خروجی.",points:10,quiz:[{q:"وظیفه اصلی PLC چیست؟",options:["تولید برق قدرت","اجرای منطق فرمان و کنترل خروجی","فقط نمایش HMI","شارژ باتری"],answer:1},{q:"ترتیب اسکن معمولاً کدام است؟",options:["خروجی-برنامه-ورودی","ورودی-برنامه-خروجی","فقط برنامه","تصادفی"],answer:1}]},{id:"l10",chapter:"فصل ۰ · برق صنعتی",title:"مدار قدرت و مدار فرمان",body:"مدار قدرت جریان موتور را از کلید، فیوز، کنتاکتور و بی‌متال عبور می‌دهد. مدار فرمان ولتاژ پایین‌تر (۲۴ ولت DC یا ۲۲۰ فرمان) کویل KM را تحریک می‌کند. لدر PLC معادل مدار فرمان است؛ کویل Q0.0 معمولاً کنتاکتور قدرت را می‌چسباند نه خود موتور را مستقیم.",points:10,exampleId:"startstop",quiz:[{q:"کویل PLC معمولاً به چه وصل می‌شود؟",options:["مستقیم سیم‌پیچ موتور","کویل کنتاکتور قدرت","نول قدرت","ارت"],answer:1},{q:"بی‌متال در کدام مدار است؟",options:["فقط HMI","مدار قدرت حفاظت حرارتی","کارت آنالوگ","پورت اترنت"],answer:1}]},{id:"l11",chapter:"فصل ۰ · برق صنعتی",title:"آدرس I ، Q ، M",body:"I ورودی دیجیتال است (I0.0 تا I0.7). Q خروجی دیجیتال. M بیت حافظه داخلی برای نگهدارنده و پرچم. T تایمر و C شمارنده. هرگز ورودی را با کویل ننویسید؛ کویل فقط روی Q یا M یا ست/ریست T و C.",points:10,quiz:[{q:"کویل را روی کدام آدرس نباید گذاشت؟",options:["Q0.0","M0.0","I0.0","هر سه درست است"],answer:2},{q:"بیت حافظه داخلی چیست؟",options:["I","Q","M","PE"],answer:2}]},{id:"l12",chapter:"فصل ۲ · مدار فرمان",title:"SET و RESET",body:"کویل SET بیت را یک می‌کند و همان‌جا می‌ماند تا RESET آن را صفر کند. برای روشنایی راهرو یا حافظه خطا مناسب است. اگر هر دو همزمان یک شوند، در این شبیه‌ساز RESET غالب است.",points:10,exampleId:"lamp",quiz:[{q:"بعد از رها کردن شستی SET چه می‌شود؟",options:["بیت صفر می‌شود","بیت یک می‌ماند","تایمر صفر می‌شود","اسکن می‌ایستد"],answer:1},{q:"خاموش کردن بیت SET شده با چیست؟",options:["NO","RESET","TON","سیم"],answer:1}]},{id:"l13",chapter:"فصل ۲ · مدار فرمان",title:"اینترلاک",body:"دو حرکت مخالف (چپ/راست، باز/بسته) نباید همزمان خروجی بگیرند. کنتاکت NC خروجی یکی را در رانگ دیگری می‌گذارند. درب اتوماتیک و موتور جلو/عقب نمونه هستند.",points:15,exampleId:"interlock",quiz:[{q:"اینترلاک جلو و عقب یعنی چه؟",options:["هر دو همیشه روشن","جلو و عقب همزمان روشن نشوند","فقط تایمر","قطع استپ"],answer:1},{q:"در رانگ جلو معمولاً چه کنتاکتی از عقب است؟",options:["NO عقب","NC خروجی عقب","کویل عقب","CTU"],answer:1}]},{id:"l14",chapter:"فصل ۵ · کارخانه",title:"سنسور و ایمنی",body:"لیمیت سوییچ، چشم نوری و فلوتر سطح، ورودی PLC هستند. استپ اضطراری باید NC باشد تا قطع سیم هم ماشین را بخواباند. هیچ‌گاه ایمنی را فقط در نرم‌افزار نگذارید؛ سخت‌افزار redundance لازم است.",points:15,exampleId:"estop",quiz:[{q:"چرا استپ اضطراری NC است؟",options:["ارزان‌تر است","قطع سیم هم مدار را باز می‌کند","زیباتر است","فقط برای HMI"],answer:1},{q:"چشم نوری نوار معمولاً کدام است؟",options:["خروجی Q","ورودی I","تایمر T","کنتاکتور قدرت"],answer:1}]},{id:"l15",chapter:"فصل ۳ · تایمر",title:"جدول تایمرها",table:{h:["نوع","شروع شمارش","خروجی Q","نمونه"],r:[["TON","وقتی ورودی ۱ بماند","بعد از PT یک می‌شود","تأخیر استارت موتور"],["TOF","وقتی ورودی ۰ شود","تا PT یک می‌ماند","فن خنک‌کاری"],["CTU","لبه بالارونده","وقتی ACC≥PV","شمارش قطعه"]]},body:"TON: تأخیر در وصل. TOF: تأخیر در قطع. TP (در برخی PLCها): پالس ثابت. ACC زمان سپری‌شده و PT زمان تنظیم است. واحد اینجا میلی‌ثانیه است؛ ۲۰۰۰ یعنی ۲ ثانیه. جدول سمت لدر ACC و Q را زنده نشان می‌دهد.",points:10,exampleId:"timer",quiz:[{q:"PT=2000 یعنی چه؟",options:["۲ ساعت","۲ ثانیه","۲ اسکن","۲ روز"],answer:1},{q:"کدام تایمر بعد از قطع ورودی هنوز یک می‌ماند؟",options:["TON","TOF","CTU","NO"],answer:1}]},{id:"l16",chapter:"فصل ۶ · آزمایشگاه",title:"چطور خودت برنامه بنویسی",body:"تب آزمایشگاه یک صفحه خالی است. ابزار NO/NC/کویل را بچین، آدرس بده، RUN کن و از پنل I بیت‌ها را دستی یک کن. به کارخانه وصل نیست تا آزاد آزمایش کنی. اگر برنامه کارخانه خراب شد دکمه بازگشت به حالت اول کارخانه را بزن.",points:10,quiz:[{q:"برای تست آزاد بدون کارخانه کجا بروی؟",options:["فقط مایکت","آزمایشگاه","تنظیمات تم","چاپ"],answer:1},{q:"اگر لدر کارخانه را پاک کردی چه کنی؟",options:["اپ را حذف کن","بازگشت به حالت اول کارخانه","گوشی را ریست کن","آدرس را عوض نکن"],answer:1}]},{id:"l17",chapter:"فصل ۳ · تایمر",title:"تنظیم PT تایمر",body:"سلول تایمر را لمس کن (جایگزین نمی‌شود). پایین صفحه PT را به میلی‌ثانیه بده. ۲۰۰۰ یعنی ۲ ثانیه. در RUN وقتی ورودی تایمر یک بماند، ACC تا PT می‌رود و بیت T یک می‌شود.",points:10,exampleId:"timer",quiz:[{q:"PT را کجا عوض می‌کنی؟",options:["فقط چاپ","با لمس سلول تایمر در ویرایشگر","HMI","مایکت"],answer:1}]},{id:"l18",chapter:"فصل ۴ · شمارنده",title:"تنظیم PV کانتر",body:"سلول CTU را لمس کن و PV را عدد بده مثلاً ۵. هر پالس ورودی یک واحد به ACC اضافه می‌کند تا به PV برسد.",points:10,exampleId:"counter",quiz:[{q:"PV یعنی چه؟",options:["ولتاژ","مقدار هدف شمارنده","زمان","جریان"],answer:1}]},{id:"l19",chapter:"فصل ۰ · برق صنعتی",title:"سه فاز و کنتاکتور",body:"موتور القایی سه‌فاز از L1 L2 L3 تغذیه می‌شود. کنتاکتور KM با سه کنتاکت قدرت این خطوط را وصل می‌کند. کویل KM از مدار فرمان ۲۴ ولت یا ۲۲۰ فرمان انرژی می‌گیرد. خروجی PLC معمولاً همین کویل را تحریک می‌کند نه سیم‌پیچ موتور را مستقیم.",points:10,exampleId:"startstop",quiz:[{q:"کنتاکتور قدرت چه می‌کند؟",options:["فقط نمایش","وصل و قطع جریان موتور","شارژ باتری","تولید پالس"],answer:1}]},{id:"l20",chapter:"فصل ۰ · برق صنعتی",title:"بی‌متال و حفاظت",body:"رله حرارتی (FR) جریان بیش از حد موتور را حس می‌کند و کنتاکت NC آن مدار فرمان را قطع می‌کند. فیوز و کلید مینیاتوری حفاظت اتصال کوتاه‌اند. در لدر می‌توان کنتاکت NC بی‌متال را به‌صورت ورودی I هم خواند.",points:10,quiz:[{q:"بی‌متال بیشتر کدام خطا را می‌گیرد؟",options:["قطع فاز نمایشگر","اضافه‌بار حرارتی موتور","قطع اترنت","خطای HMI"],answer:1}]},{id:"l21",chapter:"فصل ۲ · مدار فرمان",title:"شستی استارت و استپ",body:"استارت لحظه‌ای و NO است. استپ باید NC باشد تا قطع سیم هم ماشین را بخواباند. بعد از استارت، کنتاکت خودنگهدار KM موازی استارت مدار را نگه می‌دارد. دو رانگ روی یک کویل در این شبیه‌ساز مثل موازی است.",points:10,exampleId:"startstop",quiz:[{q:"استپ اضطراری بهتر است؟",options:["NO","NC","TON","CTU"],answer:1}]},{id:"l22",chapter:"فصل ۲ · مدار فرمان",title:"بیت حافظه M",body:"M بیت داخلی PLC است. برای پرچم، مرحله، و نگهدارنده بدون خروجی فیزیکی استفاده می‌شود. می‌توانی M0.0 را با کویل ست کنی و بعد با کنتاکت NO از آن خروجی Q را فرمان بدهی.",points:10,quiz:[{q:"M چیست؟",options:["ورودی سخت‌افزار","بیت حافظه داخلی","خروجی رله قدرت","ارت"],answer:1}]},{id:"l23",chapter:"فصل ۵ · کارخانه",title:"نوار نقاله و چشم نوری",body:"موتور نوار Q است. سنسور قطعه ورودی I است. وقتی جعبه جلوی چشم باشد بیت یک می‌شود و می‌توان لامپ یا شمارنده را فعال کرد. در مثال نوار، I0.2 همان PE است.",points:10,exampleId:"conveyor",quiz:[{q:"چشم نوری معمولاً کدام است؟",options:["خروجی Q","ورودی I","تایمر","کنتاکتور قدرت"],answer:1}]},{id:"l24",chapter:"فصل ۵ · کارخانه",title:"مخزن و سطح",body:"فلوتر پایین می‌گوید آب هست. فلوتر بالا یعنی پر است و باید پمپ با NC قطع شود. استارت پرکن یک شستی است. هیچ‌گاه پمپ را بدون سطح‌بالا رها نکن.",points:10,exampleId:"tank",quiz:[{q:"سطح بالا معمولاً پمپ را؟",options:["روشن می‌کند","با NC قطع می‌کند","می‌شمارد","HMI را می‌بندد"],answer:1}]},{id:"l25",chapter:"فصل ۰ · برق صنعتی",title:"اسکن PLC",body:"هر اسکن: خواندن ورودی‌ها، اجرای همه رانگ‌ها از بالا به پایین، نوشتن خروجی‌ها. تایمر با زمان واقعی اسکن جلو می‌رود. اگر برنامه طولانی شود زمان اسکن زیاد می‌شود.",points:10,quiz:[{q:"خروجی کی به‌روز می‌شود؟",options:["وسط رانگ","پایان اسکن پس از اجرای برنامه","فقط هنگام STOP","تصادفی"],answer:1}]},{id:"l26",chapter:"فصل ۲ · مدار فرمان",title:"SET RESET در عمل",body:"روشنایی راهرو: شستی روشن SET روی Q، شستی خاموش RESET. اگر هر دو یک شوند در این شبیه‌ساز RESET غالب است. برای حافظه خطا هم همین الگو را به کار ببر.",points:10,exampleId:"lamp",quiz:[{q:"خاموش کردن بیت SET شده؟",options:["NO","RESET","سیم","HMI فقط"],answer:1}]},{id:"l27",chapter:"فصل ۵ · کارخانه",title:"درب و اینترلاک حرکتی",body:"موتور باز و موتور بسته نباید همزمان یک شوند. کنتاکت NC خروجی یکی در رانگ دیگری است. لیمیت بالا باز را قطع می‌کند و لیمیت پایین بسته را.",points:10,exampleId:"door",quiz:[{q:"اینترلاک باز و بسته یعنی؟",options:["هر دو همیشه روشن","همزمان روشن نشوند","فقط تایمر","قطع اترنت"],answer:1}]},{id:"l28",chapter:"فصل ۳ · تایمر",title:"TOF برای خنک‌کاری فن",body:"وقتی فرمان فن قطع شود هنوز چند ثانیه بچرخد تا حرارت برود. TOF همین کار را می‌کند: با قطع ورودی، Q تا PT یک می‌ماند.",points:10,exampleId:"fan",quiz:[{q:"فن بعد از استپ کمی می‌ماند به خاطر؟",options:["CTU","TOF","SET","ارت"],answer:1}]},{id:"l29",chapter:"فصل ۰ · برق صنعتی",title:"ولتاژ فرمان و قدرت",body:"قدرت: ۴۰۰ ولت سه‌فاز یا ۲۳۰ تکفاز. فرمان: اغلب ۲۴ ولت DC برای ایمنی و PLC. کارت خروجی ترانزیستوری ۲۴ ولت را به رله اینترفیس یا کنتاکتور ۲۴ ولت می‌دهد.",points:10,quiz:[{q:"ولتاژ رایج ورودی PLC دیجیتال؟",options:["۴۰۰VAC مستقیم","۲۴VDC","۱۱کیلوولت","۵ ولت USB"],answer:1}]},{id:"l30",chapter:"فصل ۶ · آزمایشگاه",title:"نام‌گذاری و مستندسازی",body:"هر آدرس یک نام فارسی داشته باشد: استارت، استپ، KM1، PE. در ویرایشگر سلول، فیلد نام را پر کن. برنامه بدون نام بعداً خوانده نمی‌شود.",points:10,quiz:[{q:"نام I0.0 را کجا می‌نویسی؟",options:["فقط کاغذ","فیلد نام در ویرایشگر سلول","تنظیمات تم","مایکت"],answer:1}]},{id:"l31",chapter:"فصل ۱ · نمادها",title:"جدول نماد لدر",img:"https://images.pexels.com/photos/257700/pexels-photo-257700.jpeg?auto=compress&cs=tinysrgb&w=800",table:{h:["نماد","شکل","کار"],r:[["NO","| |","کنتاکت باز"],["NC","|/|","کنتاکت بسته"],["کویل","( ) دایره","خروجی"],["SET / RST","(S) (R)","حافظه"],["TON / TOF","مستطیل","زمان"],["CTU","مستطیل","شمارش"]]},body:"در آذر و IEC کویل دایره است نه دو خط. دو خط فقط برای کنتاکت است. این جدول را حفظ کن تا مدار را سریع بخوانی.",points:10,quiz:[{q:"کویل چه شکلی است؟",options:["دو خط","دایره","مثلث","فقط متن"],answer:1}]},{id:"l32",chapter:"فصل ۰ · برق صنعتی",title:"تابلو فرمان از نزدیک",img:"https://images.pexels.com/photos/257736/pexels-photo-257736.jpeg?auto=compress&cs=tinysrgb&w=800",table:{h:["قطعه تابلو","نقش"],r:[["کلید ورودی","قطع کل تغذیه"],["فیوز / MCB","اتصال کوتاه"],["کنتاکتور","وصل قدرت موتور"],["بی‌متال","اضافه‌بار"],["PLC","منطق فرمان"],["ترمینال","سیم‌کشی میدان"]]},body:"قبل از برنامه، تابلو را بشناس. قدرت و فرمان را جدا کن. سیم زرد-سبز ارت است و نباید به خروجی PLC برود.",points:10,quiz:[{q:"ارت به کجا وصل می‌شود؟",options:["خروجی Q","شینه PE","کویل KM مستقیم به فاز","پورت اترنت"],answer:1}]},{id:"l33",chapter:"فصل ۵ · کارخانه",title:"خط تولید و سنسور",img:"https://images.pexels.com/photos/18631424/pexels-photo-18631424.jpeg?auto=compress&cs=tinysrgb&w=800",table:{h:["سنسور","آدرس نمونه","وقتی یک می‌شود"],r:[["شستی استارت","I0.0","فشردن"],["شستی استپ","I0.1","فشردن (NC در لدر)"],["چشم نوری","I0.2","قطعه جلوی سنسور"],["لیمیت","I0.3","رسیدن مکانیزم"]]},body:"در کارخانه مجازی همین آدرس‌ها به تصویر وصل‌اند. برنامه را RUN کن و ببین سنسور بیت را می‌نویسد و کویل عملگر را حرکت می‌دهد.",points:10,exampleId:"conveyor",quiz:[{q:"I0.2 در نوار چیست؟",options:["موتور","چشم نوری قطعه","لامپ","تایمر"],answer:1}]},{id:"l34",chapter:"فصل ۰ · برق صنعتی",title:"موتور و راه‌انداز مستقیم",img:"https://images.pexels.com/photos/257736/pexels-photo-257736.jpeg?auto=compress&cs=tinysrgb&w=800",table:{h:["قطعه","نقش در DOL"],r:[["KM","کنتاکتور قدرت"],["FR","بی‌متال"],["SB1 استپ","NC قطع"],["SB2 استارت","NO وصل"],["Q PLC","کویل KM"]]},body:"راهانداز مستقیم یعنی کنتاکتور سه فاز را یکجا به موتور می‌دهد. مدار فرمان استارت/استپ همین را کنترل می‌کند. مثال استارت استپ را در کارخانه ببین.",points:10,exampleId:"startstop",quiz:[{q:"DOL یعنی؟",options:["ستاره مثلث","وصل مستقیم کنتاکتور به موتور","اینورتر","نرم‌استارت فقط"],answer:1}]},{id:"l35",chapter:"فصل ۵ · کارخانه",title:"مخزن و پمپ",img:"https://images.pexels.com/photos/17765433/pexels-photo-17765433.jpeg?auto=compress&cs=tinysrgb&w=800",table:{h:["سیگنال","آدرس","اثر"],r:[["استارت پرکن","I0.2","شروع پمپ"],["سطح بالا","I0.1","قطع پمپ"],["پمپ","Q0.0","پر شدن مخزن"]]},body:"پمپ را بدون سنسور بالا رها نکن. در پنل کارخانه همه شستی‌های I را داری حتی اگر روی تصویر نباشد.",points:10,exampleId:"tank",quiz:[{q:"قطع پمپ در پر شدن با چیست؟",options:["فقط تایمر","سطح بالا NC","HMI","شمارنده"],answer:1}]},{id:"l36",chapter:"فصل ۰ · برق صنعتی",title:"رنگ سیم‌ها و ایمنی",img:"https://images.pexels.com/photos/257736/pexels-photo-257736.jpeg?auto=compress&cs=tinysrgb&w=800",table:{h:["رنگ","معنی رایج"],r:[["زرد-سبز","ارت PE"],["آبی","نول"],["قهوه‌ای / سیاه / خاکستری","فاز"],["قرمز / آبی تیره فرمان","مدار ۲۴ ولت"]]},body:"قبل از دست زدن به تابلو، ولتاژ را قطع کن و تستر بزن. ارت را هرگز به خروجی PLC وصل نکن. سیم فرمان و قدرت را در داکت جدا بگذار.",points:10,quiz:[{q:"سیم زرد-سبز چیست؟",options:["فاز","ارت","خروجی Q","پالس انکودر"],answer:1}]},{id:"l37",chapter:"فصل ۲ · مدار فرمان",title:"نگهدارنده قدم‌به‌قدم",table:{h:["رانگ","عناصر","نتیجه"],r:[["۱","استارت NO + استپ NC + کویل Q","وصل لحظه‌ای"],["۲","کنتاکت Q + استپ NC + کویل Q","نگه داشتن"],["۳","کنتاکت Q + کویل لامپ","اعلام کار"]]},body:"بدون نگهدارنده، با رها کردن استارت موتور می‌ایستد. رانگ دوم کنتاکت خودِ خروجی را موازی استارت می‌کند. استپ NC هر دو مسیر را قطع می‌کند.",points:10,exampleId:"startstop",quiz:[{q:"رانگ دوم نگهدارنده چیست؟",options:["تایمر","کنتاکت خود خروجی","فقط HMI","شمارنده"],answer:1}]},{id:"l38",chapter:"فصل ۳ · تایمر",title:"مثال عددی TON",table:{h:["زمان","ورودی","ACC","Q"],r:[["۰ ث","۱","۰","۰"],["۱ ث","۱","۱۰۰۰","۰"],["۲ ث PT=2000","۱","۲۰۰۰","۱"],["قطع ورودی","۰","۰","۰"]]},body:"اگر PT را ۳۰۰۰ بگذاری، سه ثانیه بعد از نگه داشتن استارت، خروجی تایمر یک می‌شود. قطع استارت ACC را صفر می‌کند.",points:10,exampleId:"timer",quiz:[{q:"در جدول بالا Q کی یک شد؟",options:["همان لحظه","وقتی ACC به PT رسید","قطع ورودی","STOP"],answer:1}]},{id:"l39",chapter:"فصل ۴ · شمارنده",title:"مثال عددی CTU",table:{h:["پالس","ACC","PV=5","Q"],r:[["۱","۱","۵","۰"],["۴","۴","۵","۰"],["۵","۵","۵","۱"],["ریست","۰","۵","۰"]]},body:"هر لبه بالارونده سنسور یک قطعه است. برای ریست، کویل RST روی همان آدرس C بگذار.",points:10,exampleId:"counter",quiz:[{q:"Q کانتر کی یک می‌شود؟",options:["پالس اول","وقتی ACC به PV برسد","همیشه","فقط TON"],answer:1}]},{id:"l40",chapter:"فصل ۵ · کارخانه",title:"نقشه I/O نمونه کارخانه",img:"https://images.pexels.com/photos/18631424/pexels-photo-18631424.jpeg?auto=compress&cs=tinysrgb&w=800",table:{h:["کارخانه","ورودی مهم","خروجی مهم"],r:[["موتور DOL","استارت / استپ","KM و لامپ"],["نوار","استارت / PE","موتور نوار"],["مخزن","استارت پرکن / سطح بالا","پمپ"],["چراغ راهنمایی","تایمرها","قرمز زرد سبز"]]},body:"از پنل شستی کارخانه هر کلید را با نامش می‌بینی. RUN را بزن و شستی را نگه دار تا تصویر کارخانه عوض شود.",points:10,exampleId:"conveyor",quiz:[{q:"پمپ مخزن معمولاً کدام خروجی است؟",options:["I0.0","Q0.0","T3","C1"],answer:1}]},{id:"l41",chapter:"فصل ۷ · حفاظت و ایمنی",title:"استپ اضطراری و مدار ایمنی",img:"https://images.pexels.com/photos/257736/pexels-photo-257736.jpeg?auto=compress&cs=tinysrgb&w=800",table:{h:["قطعه","نوع کنتاکت","چرا"],r:[["قارچی اضطراری","NC","قطع سیم هم توقف می‌دهد"],["درِ تابلو","NC","باز شدن در فرمان را قطع کند"],["بی‌متال","NC","اضافه‌بار"],["رله ایمنی","کنتاکت اجباری","استاندارد ماشین"]]},body:"ایمنی را فقط به نرم‌افزار نسپار. استپ اضطراری باید سخت‌افزاری مدار فرمان را ببرد. در لدر هم کنتاکت NC آن را بگذار تا برنامه هماهنگ باشد.",points:10,exampleId:"estop",quiz:[{q:"قارچی اضطراری معمولاً؟",options:["NO","NC","TON","SET"],answer:1}]},{id:"l42",chapter:"فصل ۸ · سنسور و ابزار دقیق",title:"انواع سنسور صنعتی",img:"https://images.pexels.com/photos/18631424/pexels-photo-18631424.jpeg?auto=compress&cs=tinysrgb&w=800",table:{h:["سنسور","خروجی به PLC","کاربرد"],r:[["القایی","PNP/NPN ۲۴V","فلز نزدیک"],["خازنی","دیجیتال","مایع و پلاستیک"],["فوتوالکتریک","دیجیتال","قطعه روی نوار"],["لیمیت","کنتاکت خشک","انتهای کورس"],["فلوتر","دیجیتال","سطح مخزن"]]},body:"سنسور PNP معمولاً به ورودی ۲۴ ولت PLC می‌رود. قطبیت و مشترک ۰ ولت را درست ببند وگرنه ورودی همیشه یک یا همیشه صفر می‌ماند.",points:10,exampleId:"conveyor",quiz:[{q:"چشم نوری نوار معمولاً به کدام می‌رود؟",options:["خروجی Q","ورودی I","ارت قدرت","کویل KM مستقیم"],answer:1}]},{id:"l43",chapter:"فصل ۹ · موتور و راه‌انداز",title:"DOL ستاره-مثلث و اینورتر",img:"https://images.pexels.com/photos/257736/pexels-photo-257736.jpeg?auto=compress&cs=tinysrgb&w=800",table:{h:["روش","وقتی استفاده می‌شود","ن
